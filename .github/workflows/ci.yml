name: POLLO CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.mod

      - name: Run Backend Tests
        run: go test -v ./...

      - name: Scientific Validation & Statistical Benchmarks
        run: go test -v -run TestScientificValidation ./tests/...

      - name: Set up Python for Reference Verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cross-Verify Statistical Ground Truth with Python Reference Engine
        run: python3 ../scripts/verify_scientific_validation.py

      - name: Compile Go Binary
        run: go build -v -o bin/server main.go

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build
