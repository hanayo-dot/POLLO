services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pollo-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - API_PREFIX=/api/v1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - NASA_EARTHDATA_USERNAME=${NASA_EARTHDATA_USERNAME:-}
      - NASA_EARTHDATA_PASSWORD=${NASA_EARTHDATA_PASSWORD:-}
      - NASA_EARTHDATA_BEARER_TOKEN=${NASA_EARTHDATA_BEARER_TOKEN:-}
      - NASA_GIBS_ENDPOINT=${NASA_GIBS_ENDPOINT:-https://gibs.earthdata.nasa.gov/wmts/epsg3857/best}
      - CACHE_DIR=/app/data/cache
    volumes:
      - ./data/cache:/app/data/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pollo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
